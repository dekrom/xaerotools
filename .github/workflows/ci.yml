name: CI

on:
  push:
    branches: [main]
    # Release only builds and packages — tags run the checks too, so the exact
    # commit going out has a visible fmt/clippy/test result.
    tags: ["v*"]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    strategy:
      matrix:
        # Half the release matrix is macOS; without it here a macOS-only break
        # first shows up at tag time and withholds every platform's zip.
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace -- -D warnings
      # Corpus/archive tests are #[ignore]d and need real data; run with --ignored locally.
      - uses: taiki-e/install-action@nextest
      - run: cargo nextest run --workspace
      - run: cargo test --workspace --doc

  wasm-core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      # The core crate must stay WASM-clean (future zero-install browser build).
      - run: cargo check -p xaero-core --target wasm32-unknown-unknown

  webui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
        working-directory: webui
      - run: npm run build
        working-directory: webui

  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      # Instrumented builds use different RUSTFLAGS, so they get their own cache key.
      - uses: Swatinem/rust-cache@v2
        with:
          key: llvm-cov
      - uses: taiki-e/install-action@cargo-llvm-cov
      - uses: taiki-e/install-action@nextest
      - run: cargo llvm-cov nextest --workspace --lcov --output-path lcov.info
      - run: cargo llvm-cov report --summary-only >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: coverage-lcov
          path: lcov.info

  no-silent-skips:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fail if a test silently returns on missing corpus
        run: |
          if grep -rEn 'corpus_root\(\)\s*else\s*\{|(std::)?env::var\("XAERO_[A-Z_]*CORPUS"\)\s*else\s*\{' crates; then
            echo "::error::Found a silent corpus/env else-skip. Use #[ignore] + .expect(), not a silent return."
            exit 1
          fi
