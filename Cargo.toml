[workspace]
resolver = "2"
members = ["crates/xaero-core", "crates/xaero-db", "crates/xaero-merge", "crates/xaero-scan", "crates/xaero-zvcr", "crates/xaerotools-server", "crates/xaerotools-cli", "tools/xaero-colorgen", "crates/test-support"]

[workspace.package]
version = "0.4.0"
edition = "2021"
rust-version = "1.89"
license = "MIT"
authors = ["XaeroTools contributors"]
repository = "https://github.com/dekrom/xaerotools"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"

# Fast-enough dev builds for the 400 MB corpus tests
[profile.dev.package."*"]
opt-level = 2

[profile.dev]
opt-level = 1
