[package]
name = "xaerotools-server"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
xaero-core = { path = "../xaero-core" }
xaero-scan = { path = "../xaero-scan" }
axum = { version = "0.8", features = ["ws"] }
tokio = { version = "1", features = ["full"] }
notify = "8"
futures-util = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
png = "0.18"
include_dir = "0.7"
lru = "0.18.2"
rayon = "1"
xaero-merge = { path = "../xaero-merge" }
xaero-db = { path = "../xaero-db" }
getrandom = "0.4.3"
rusqlite = { version = "0.37", features = ["bundled"] }

[dev-dependencies]
test-support = { path = "../test-support" }
